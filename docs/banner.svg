<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">dsh-mono</title>
  <desc id="desc">Ten focused dsh plugins. Independent packages and releases, shared local verification.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1224"/><stop offset="1" stop-color="#162a43"/></linearGradient>
    <linearGradient id="accent" x2="1" y2="0"><stop stop-color="#5eead4"/><stop offset="1" stop-color="#60a5fa"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#a5c9ee" stroke-opacity=".06"/></pattern>
  </defs>
  <rect width="1280" height="360" rx="22" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="22" fill="url(#grid)"/>
  <rect x="54" y="49" width="42" height="4" rx="2" fill="url(#accent)"/>
  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <text x="54" y="91" fill="#93b6d6" font-size="14" font-weight="600" letter-spacing="3">THE DSH PLUGIN COLLECTION</text>
    <text x="50" y="183" fill="#f1f5f9" font-size="78" font-weight="750" letter-spacing="-4">dsh<tspan fill="#5eead4">-</tspan>mono</text>
    <text x="55" y="226" fill="#c4d4e5" font-size="21">Focused tools. Independent releases.</text>
    <text x="55" y="263" fill="#86a2bf" font-size="16">10 plugins · shared development · local verification</text>
    <g transform="translate(780 61)">
      <rect width="445" height="238" rx="14" fill="#0a1424" stroke="#37516c"/>
      <path d="M0 39H445" stroke="#293f58"/>
      <circle cx="20" cy="20" r="4" fill="#64748b"/><circle cx="35" cy="20" r="4" fill="#64748b"/><circle cx="50" cy="20" r="4" fill="#64748b"/>
      <text x="73" y="25" font-size="12" fill="#92abc6" letter-spacing="1">PLUGINS / 0.1.0</text>
      <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="14">
        <text x="23" y="76" fill="#5eead4">01–05</text><text x="95" y="76" fill="#dbeafe">BUILD &amp; EDIT</text>
        <text x="23" y="105" fill="#9db4ce">rtk · rewind · file-context</text>
        <text x="23" y="129" fill="#9db4ce">hashline · red-green</text>
        <path d="M23 149H422" stroke="#263e56"/>
        <text x="23" y="177" fill="#60a5fa">06–10</text><text x="95" y="177" fill="#dbeafe">NAVIGATE &amp; REMEMBER</text>
        <text x="23" y="205" fill="#9db4ce">compass · recall · notes</text>
        <text x="23" y="226" fill="#9db4ce">dotenv · caffeinate</text>
      </g>
    </g>
    <text x="55" y="324" fill="#7392b0" font-size="12" letter-spacing="2">INSPIRED BY PI · IMPLEMENTED FOR DSH</text>
  </g>
</svg>
