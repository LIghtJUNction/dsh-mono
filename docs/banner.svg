<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">dsh-mono</title>
  <desc id="desc">Ten focused dsh plugins. Independent packages and releases, shared local verification.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f5f0e6"/><stop offset="1" stop-color="#e9dfcc"/></linearGradient>
    <linearGradient id="accent" x2="1" y2="0"><stop stop-color="#b55736"/><stop offset="1" stop-color="#bf8f43"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#887b66" stroke-opacity=".055"/></pattern>
  </defs>
  <rect width="1280" height="360" rx="22" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="22" fill="url(#grid)"/>
  <rect x="54" y="49" width="42" height="4" rx="2" fill="url(#accent)"/>
  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <text x="54" y="91" fill="#766650" font-size="14" font-weight="600" letter-spacing="3">THE DSH PLUGIN COLLECTION</text>
    <text x="50" y="183" fill="#29251f" font-size="78" font-weight="750" letter-spacing="-4">dsh<tspan fill="#b55736">-</tspan>mono</text>
    <text x="55" y="226" fill="#51493f" font-size="21">Focused tools. Independent releases.</text>
    <text x="55" y="263" fill="#766c5f" font-size="16">10 plugins · shared development · local verification</text>
    <g transform="translate(780 61)">
      <rect width="445" height="238" rx="14" fill="#fbf8f0" stroke="#c9bfae"/>
      <path d="M0 39H445" stroke="#dbd0bc"/>
      <circle cx="20" cy="20" r="4" fill="#b5a48b"/><circle cx="35" cy="20" r="4" fill="#b5a48b"/><circle cx="50" cy="20" r="4" fill="#b5a48b"/>
      <text x="73" y="25" font-size="12" fill="#776b59" letter-spacing="1">PLUGINS / 0.1.0</text>
      <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="14">
        <text x="23" y="76" fill="#a84e30">01–05</text><text x="95" y="76" fill="#39342d">BUILD &amp; EDIT</text>
        <text x="23" y="105" fill="#6b6052">rtk · rewind · file-context</text>
        <text x="23" y="129" fill="#6b6052">hashline · red-green</text>
        <path d="M23 149H422" stroke="#dbd0bc"/>
        <text x="23" y="177" fill="#8d6d30">06–10</text><text x="95" y="177" fill="#39342d">NAVIGATE &amp; REMEMBER</text>
        <text x="23" y="205" fill="#6b6052">compass · recall · notes</text>
        <text x="23" y="226" fill="#6b6052">dotenv · caffeinate</text>
      </g>
    </g>
    <text x="55" y="324" fill="#82735e" font-size="12" letter-spacing="2">INSPIRED BY PI · IMPLEMENTED FOR DSH</text>
  </g>
</svg>
